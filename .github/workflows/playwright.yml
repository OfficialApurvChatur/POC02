name: Playwright Tests
on:
  push:
    branches: [ develop, test, stage, prod ]
  pull_request:
    branches: [ develop, test, stage, prod ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      NODE_ENV: ${{ secrets.NODE_ENV || 'testing' }}
      NODE_MACHINE: ${{ secrets.NODE_MACHINE || 'live' }}
      NODE_PORT: ${{ secrets.NODE_PORT || 8000 }}
      NODE_APP_NAME: ${{ secrets.NODE_APP_NAME || 'POC02-ExpressShadcnSetup (test)' }}
      BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://express-shadcn-v01-backend-test.onrender.com' }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://express-shadcn-v01-frontend-test.netlify.app' }}
    defaults:
      run:
        working-directory: site/testing
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: site/testing/playwright-report/
        retention-days: 30
